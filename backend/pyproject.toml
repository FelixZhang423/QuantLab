[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-backend"
version = "0.1.0"
description = "QuantLab 后端：因子生成、股票池、TopK 回测与 FastAPI Web API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "PyMySQL",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["common", "schemas"]

[tool.setuptools.packages.find]
include = ["custom_bt*", "api*", "services*", "repositories*", "workers*", "config*", "cli*", "scripts*", "infra*", "adapters*"]

[tool.setuptools.package-data]
custom_bt = ["**/*.yaml", "**/*.json"]

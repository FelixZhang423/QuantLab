# clickhouse = 直接读公司库；local = 旧本地主缓存（仅保留兼容）
data_source: clickhouse
master_store: "../data_cache/master"
pools_root: "../data_cache/pools"
runtime_root: "../data_cache/factor_runtime"
factor_runs_root: "../../factor_runs"
fields:
  - open
  - close
  - high
  - low
  - ycp
  - volume
  - amount
  - ChangePCT
  - RangePCT
  - TurnoverRate
  - Ifsuspend
  - if_up
  - if_flat
  - if_down
  - RisingUpDays
  - FallingDownDays
  - MaxRisingUpDays
  - MaxFallingDownDays
  - HighestPrice
  - LowestPrice
  - ema12
  - ema26
  - dif
  - dea
  - macd
  - max_high_9
  - min_low_9
  - RSV
  - kdj_k
  - kdj_d
  - kdj_j
  - ma4
  - ma5
  - ma8
  - ma12
  - ma16
  - ma20
  - ma47
  # 财务字段：生成面板会按 InfoPublDate as-of 合并（列名保留 fund_ 前缀）。
  # 字段列表变了 runtime_id 就会变，旧的 factor_runtime 缓存不会复用。
  - fund_NetOperateCashFlow
  - fund_FairValueChangeIncome
  - fund_NetProfit
  - fund_TotalAssets
  # 每日估值字段：按交易日直接对齐，无披露日问题。
  - val_PB
  - val_PSTTM
  - val_PCFTTM
  - val_DividendRatioLYR
  - val_TotalMV
# 估值字段从 2024-01-01 才有数据，训练窗口整体后移；2022-2023 不再参与估值因子训练。
splits:
  train:
    cache_start: "2024-01-01"
    cache_end: "2025-06-30"
  valid:
    cache_start: "2025-01-25"
    cache_end: "2026-01-28"
  test:
    cache_start: "2025-07-27"
    cache_end: "2026-06-12"
max_backtrack_days: 100
target_horizon: 20
max_future_days: 20
target_factor_count: 50
max_attempts: 100000
rollout_timesteps: 2048
seed: 0
device: cpu
quality:
  min_coverage: 0.9
  min_train_ic: 0.05
  min_valid_ic: 0.04
  min_icir: 0.5
  score_ic_weight: 0.5
  score_rank_ic_weight: 0.3
  score_icir_weight: 0.2

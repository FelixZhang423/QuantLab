name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn pydantic pandas numpy pyarrow pyyaml matplotlib PyMySQL pytest pytest-subtests
      - name: Compile
        run: python -m compileall -q api services repositories workers config cli scripts infra adapters common.py errors.py schemas.py custom_bt
      - name: Layering + API smoke tests
        run: python -m pytest -q tests/test_layering.py tests/test_api_routes.py tests/test_canonical_expression.py tests/test_expressions.py tests/test_operator_registry.py tests/test_pools.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
